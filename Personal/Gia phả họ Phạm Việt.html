<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gia phả họ Phạm Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: hero cụ tổ → mục lục 7 nhà (đời 2) → mỗi nhà là một cây thụt lề, đường dọc màu theo đời */
:root{
  --bg:#f6f5f2; --paper:#ffffff; --ink:#1f1b18; --muted:#6b635c; --line:#e3ded6;
  --lacquer:#9b1c1c; --gold:#a37b22; --flag:#c81e1e;
  --g1:#9b1c1c; --g2:#b45309; --g3:#7c6a12; --g4:#2f6b3a; --g5:#1f5f86; --g6:#5b3f8f;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f; --paper:#1f1b16; --ink:#efe9e1; --muted:#a69d92; --line:#36302a;
  --lacquer:#e0605a; --gold:#d4ad55; --flag:#ff6b6b;
  --g1:#e0605a; --g2:#e8954a; --g3:#cdb54a; --g4:#6cbf7a; --g5:#64a9d6; --g6:#a88be0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16130f; --paper:#1f1b16; --ink:#efe9e1; --muted:#a69d92; --line:#36302a;
  --lacquer:#e0605a; --gold:#d4ad55; --flag:#ff6b6b;
  --g1:#e0605a; --g2:#e8954a; --g3:#cdb54a; --g4:#6cbf7a; --g5:#64a9d6; --g6:#a88be0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 120px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* Hero */
.hero{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--lacquer);border-radius:6px;padding:26px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.hero .lbl{color:var(--lacquer)}
.hero h1{font-size:clamp(24px,4.4vw,36px);color:var(--lacquer);font-weight:700;line-height:1.2}
.hero .place{font-family:var(--serif);font-size:clamp(15px,2.4vw,19px);color:var(--ink)}
.hero .gio{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:600;color:var(--gold)}

/* Legend + tools */
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend .red{color:var(--flag);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:240px;max-width:100%}
button{font:inherit;cursor:pointer}
.btn{font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.btn:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#hint{font-size:13px;color:var(--muted);min-height:1.2em}

/* Index of houses */
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.house-link{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--g2);border-radius:6px;text-decoration:none;color:var(--ink)}
.house-link:hover{border-color:var(--g2)}
.house-link strong{font-family:var(--serif);font-weight:600;font-size:15px}
.house-link small{color:var(--muted);font-size:12.5px}

/* House sections */
.house{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;scroll-margin-top:16px}
.house-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.house-head .who{display:flex;flex-direction:column;gap:4px}
.house-head h2{font-size:20px;font-weight:700}
.house-head h2 .alias{font-weight:400;font-style:italic;color:var(--muted);font-size:16px}
.house-head .spouse{font-family:var(--serif);font-size:16px}
.house-head .lbl{color:var(--g2)}
.house-body{padding:14px 16px 18px;overflow-x:auto}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:4px 4px}

/* Tree */
.group{margin-left:10px;padding-left:16px;border-left:2px solid var(--gc,var(--line));display:flex;flex-direction:column;gap:2px}
.cap{font-size:12.5px;color:var(--muted);padding:6px 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cap .gen{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--gc)}
.cap em{font-style:italic}
.person{position:relative}
.person::before{content:"";position:absolute;left:-16px;top:19px;width:12px;border-top:2px solid var(--gc,var(--line))}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 6px;border-radius:5px;min-width:0}
.row:hover{background:var(--bg)}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.name{font-family:var(--serif);font-size:16px;font-weight:600;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer}
.name:hover{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.flag{color:var(--flag)}
.sp{font-size:14px;color:var(--ink)}
.sp i{color:var(--muted);font-style:italic}
.tog{margin-left:auto;font-size:12px;color:var(--muted);background:none;border:1px solid transparent;border-radius:4px;padding:2px 8px}
.tog:hover{border-color:var(--line)}
.person.closed > .group{display:none}
.hit > .row{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.dim > .row .name{opacity:.45}
.sel > .row{outline:2px solid var(--gold)}

/* Death anniversaries */
.gio-list{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.gio-list h3{font-size:17px}
.gio-table{width:100%;border-collapse:collapse;font-size:14px}
.gio-table td{padding:7px 4px;border-top:1px solid var(--line)}
.gio-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;white-space:nowrap}
.gio-table td:nth-child(2){color:var(--muted);font-size:13px}

/* Lineage panel */
#path{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--gold);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:5}
#path .in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:flex-start}
#path ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;flex:1;min-width:0}
#path li{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
#path li .g{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;color:var(--paper);background:var(--gc)}
#path li + li::before{content:"›";color:var(--muted);margin-right:2px}
#path li:last-child{font-weight:600}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .group{margin-left:4px;padding-left:12px}
  .person::before{left:-12px;width:9px}
  input[type=search]{width:100%}
  .tools{width:100%}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap">
  <header class="hero">
    <div class="lbl">Đời 1 · Cụ tổ</div>
    <h1>Cụ ông PHẠM VIỆT &amp; Cụ bà RỤT</h1>
    <div class="place">Thôn Hải Nhuận - xã Đông Quý - huyện Tiền Hải - tỉnh Thái Bình</div>
    <div class="gio">
      <span class="chip">Ngày giỗ cụ Việt ông: <b>12/9 ÂL</b></span>
      <span class="chip">Cụ Việt bà: <b>14/4 ÂL</b></span>
    </div>
  </header>

  <div class="bar">
    <div class="legend" id="legend"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Tìm tên (vd: Hải, Thúy, Ngô…)" aria-label="Tìm tên trong gia phả">
      <button class="btn" id="openAll">Mở tất cả</button>
      <button class="btn" id="closeAll">Thu gọn</button>
    </div>
  </div>
  <div id="hint">Bấm vào một tên để xem dòng dõi từ cụ tổ xuống người đó.</div>

  <section>
    <div class="lbl" style="margin-bottom:10px">Đời 2 · Các con của cụ Việt — 7 nhà</div>
    <nav class="index" id="index"></nav>
  </section>

  <div id="houses" style="display:flex;flex-direction:column;gap:16px"></div>

  <section class="gio-list">
    <h3>Ngày giỗ ghi trong gia phả</h3>
    <table class="gio-table"><tbody id="gioBody"></tbody></table>
  </section>
</div>

<div id="path" hidden><div class="in"><ol id="pathList"></ol><button class="btn" id="pathClose" aria-label="Đóng">Đóng</button></div></div>

<script>
// {…} = phần chữ tô đỏ trong bản gốc
const ROOT = {n:"Cụ ông Phạm Việt", sp:"Cụ bà Rụt", gen:1};
const D2 = [
 {n:"Ông Phạm Phụng", gio:"10/3 ÂL", sp:[{n:"Bà Tạ Thị Hơn", gio:"18/4 ÂL"}], cap:"Con ông Phụng + bà Hơn", kids:[
  {n:"Phạm Thị Na"},
  {n:"Phạm Minh Phán", gio:"13/2 ÂL", sp:[{r:"Vợ",n:"Trịnh Thị Bí"}], cap:"Con của ông Phán + bà Bí", kids:[
    {n:"Phạm Hồ Quang", sp:[{r:"Vợ",n:"Trần Hương Lan"}], cap:"Con cháu của Quang + Lan (cháu nội ông Phán)", kids:[
      {n:"Phạm Ngọc Minh Anh", sp:[{r:"Chồng",n:"Angus Wan"}]},
      {n:"Phạm Trần Minh Đức"}]},
    {n:"Phạm Hồ Vân", sp:[{r:"Chồng",n:"Võ Ngọc Linh"}], cap:"Con cháu của Vân + Linh (cháu ngoại ông Phán)", kids:[
      {n:"Võ Ngọc Minh"},{n:"Võ Ngọc Vân Anh"}]}]},
  {n:"Phạm Thị Nương", sp:[{r:"Chồng",n:"Nguyễn Quang Hào"}], cap:"Con của bà Nương + ông Hào", kids:[
    {n:"Nguyễn Thị Thu Hà", sp:[{r:"Chồng",n:"Phạm Ngọc Thanh"}], cap:"Con cháu của Hà + Thanh (cháu ngoại bà Nương)", kids:[
      {n:"Phạm Thị Ngọc Thu", sp:[{r:"Chồng",n:"Vũ Hoàng Cương"}], cap:"con", kids:[{n:"Vũ Phạm Gia Huy"}]}]},
    {n:"Nguyễn Thị Thu Hiền", sp:[{r:"Chồng",n:"Hoàng Ngọc Sơn"}], cap:"Con cháu của Hiền + Sơn (cháu ngoại bà Nương)", kids:[
      {n:"Hoàng Nhật Minh"},{n:"Hoàng Nhật Quang"}]},
    {n:"Nguyễn Thị Thu Hằng", sp:[{r:"Chồng",n:"Trần Văn Trọng"}], cap:"Con cháu của Hằng + Trọng (cháu ngoại bà Nương)", kids:[
      {n:"Trần Đức Minh"}]}]},
  {n:"Phạm Minh Thẩm", sp:[{r:"Vợ",n:"Nguyễn Thị Vân Tường"}], cap:"Con của ông Thẩm + bà Tường", kids:[
    {n:"Phạm Minh Châu", sp:[{r:"Chồng",n:"Bùi Sỹ Tuấn"}], cap:"Con cháu của Châu + Tuấn (cháu ngoại ông Thẩm)", kids:[
      {n:"Bùi Vinh Tuệ"},{n:"Bùi Vinh Thanh"}]},
    {n:"Phạm Minh Bảo Ngọc", sp:[{r:"Chồng",n:"Trần Trung Sơn"}], cap:"Con cháu của Ngọc + Sơn (cháu ngoại ông Thẩm)", kids:[
      {n:"Trần Ngọc Trâm Anh"},{n:"Trần Trung Kiên"}]}]},
  {n:"Phạm Thị Thúy", sp:[{r:"Chồng",n:"Phạm Chí Thủa"}], cap:"Con của bà Thúy + ông Thủa", kids:[
    {n:"Phạm Minh Hải", sp:[{r:"Vợ",n:"Đỗ Thị Lan Phương"}], cap:"Con cháu của Hải + Lan Phương (cháu nội bà Thúy)", kids:[
      {n:"Phạm Nhật An"},{n:"Phạm Gia Bảo"}]},
    {n:"Phạm Thu Vân", sp:[{r:"Chồng",n:"Nguyễn Tuấn Nam"}], cap:"Con cháu của Vân + Nam (cháu ngoại bà Thúy)", kids:[
      {n:"Phạm Vân Khánh Emi"},{n:"Nguyễn Nam Khánh Henry"}]},
    {n:"Phạm Minh Đức", sp:[{r:"Vợ",n:"Đỗ Thanh Thủy"}], cap:"Con cháu của Đức + Thủy (cháu nội bà Thúy)", kids:[
      {n:"Phạm Mộc Anh"},{n:"Phạm Minh Hiếu"}]}]}
 ]},
 {n:"Ông Phạm Hoàng", sp:[{n:"Bà ........"}], cap:"Các con ông Hoàng", kids:[
  {n:"Phạm Thị {Nhỡ}"},{n:"Phạm Thị Sại"},{n:"Phạm Minh Thứ"},{n:"Phạm Thị Ngát"},{n:"Phạm Thị Sa"},
  {n:"Phạm Thị Dịu"},{n:"Phạm Ngọc Miên"},{n:"Phạm Thị Ngoan"},{n:"Phạm Thị Nguyệt"}]},
 {n:"Bà Phạm Thị Ca", alias:"bà Hiệt", sp:[{n:"Ông Hiệt"}], cap:"Các con ông bà Hiệt", kids:[
  {n:"Ngô Thị Nhiễu"},{n:"Ngô Thị Vấn"},{n:"Ngô Quốc Trị"},{n:"Ngô Văn Thoan"},{n:"Ngô Thị Tho"},{n:"Ngô Văn Toàn"}]},
 {n:"Ông Phạm Đới", gio:"20/6 ÂL"},
 {n:"Bà Phạm Thị Quẹt", alias:"bà Tư", sp:[{n:"Ông Ngô Văn Tư"}], cap:"Các con ông bà Tư", kids:[
  {n:"Nguyễn Thị Lan"},{n:"Nguyễn Văn Thịnh"},{n:"Nguyễn Quốc Oai"},{n:"Nguyễn Đại Phượng"},{n:"Nguyễn Văn Thảo"}]},
 {n:"Bà Phạm Thị Nha", alias:"bà Sinh", sp:[{n:"Ông Sinh"}], cap:"Các con ông bà Sinh", kids:[
  {n:"{Tạ Thị Dung}"},{n:"{Tạ Thị Duyên}"},{n:"{Tạ Văn Thuần}"},{n:"{Tạ Thị Thắm}"},{n:"Tạ Văn Dương"},{n:"Tạ Thế Khanh"}]},
 {n:"Bà Phạm Thị Mỹ", gio:"27/12 ÂL"}
];
const GEN = ["","Đời 1 · Cụ tổ","Đời 2 · Các con","Đời 3 · Các cháu","Đời 4 · Các chắt","Đời 5","Đời 6"];

const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\{(.+?)\}/g,'<span class="flag">$1</span>');
const plain = s => s.replace(/[{}]/g,"");
const fold = s => plain(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const gc = g => `var(--g${g})`;

// legend
document.getElementById("legend").innerHTML =
  [1,2,3,4,5,6].map(g=>`<span><i style="background:${gc(g)}"></i>Đời ${g}</span>`).join("") +
  `<span class="red">Tên chữ đỏ: giữ nguyên như bản gốc</span>`;

const all = []; // {node, el, parent}
function spText(sp){ return sp.map(s => s.r ? `<i>${s.r}:</i> ${fmt(s.n)}` : fmt(s.n)).join(", "); }

function renderKids(p, gen){
  const g = document.createElement("div");
  g.className = "group"; g.style.setProperty("--gc", gc(gen));
  g.innerHTML = `<div class="cap"><span class="gen">${GEN[gen]}</span><em>${fmt(p.cap)}</em></div>`;
  p.kids.forEach((k,i)=> g.appendChild(renderPerson(k, gen, i+1, p)));
  return g;
}
function renderPerson(p, gen, idx, parent){
  p.gen = gen; p.parent = parent;
  const el = document.createElement("div");
  el.className = "person"; el.style.setProperty("--gc", gc(gen));
  const has = p.kids && p.kids.length;
  el.innerHTML = `<div class="row">
      <span class="num">${idx}.</span>
      <button class="name" type="button">${fmt(p.n)}</button>
      ${p.gio ? `<span class="chip">giỗ <b>${esc(p.gio)}</b></span>`:""}
      ${p.sp ? `<span class="sp">+ ${spText(p.sp)}</span>`:""}
      ${has ? `<button class="tog" type="button" aria-expanded="true">Ẩn ${countDesc(p)} con cháu</button>`:""}
    </div>`;
  if(has) el.appendChild(renderKids(p, gen+1));
  wire(el, p);
  return el;
}
function countDesc(p){ return (p.kids||[]).reduce((s,k)=>s+1+countDesc(k),0); }
function wire(el, p){
  p.el = el; all.push(p);
  el.querySelector(":scope > .row .name").addEventListener("click",()=>showPath(p));
  const t = el.querySelector(":scope > .row .tog");
  if(t) t.addEventListener("click",()=>setOpen(p, el.classList.contains("closed")));
}
function setOpen(p, open){
  p.el.classList.toggle("closed", !open);
  const t = p.el.querySelector(":scope > .row .tog");
  if(t){ t.setAttribute("aria-expanded", open); t.textContent = (open?"Ẩn ":"Hiện ") + countDesc(p) + " con cháu"; }
}

// houses
const idx = document.getElementById("index"), houses = document.getElementById("houses");
D2.forEach((h,i)=>{
  h.gen = 2; h.parent = ROOT;
  const id = "nha-" + (i+1);
  const nk = h.kids ? h.kids.length : 0;
  idx.insertAdjacentHTML("beforeend",
    `<a class="house-link" href="#${id}"><strong>${fmt(h.n)}${h.alias?` <span style="font-weight:400;font-style:italic">(${h.alias})</span>`:""}</strong>
     <small>${h.sp ? spText(h.sp) : (h.gio ? "Ngày giỗ " + esc(h.gio) : "")}</small>
     <small>${nk ? `${nk} người con · ${countDesc(h)} con cháu` : "Bản gốc không ghi con cháu"}</small></a>`);
  const sec = document.createElement("section");
  sec.className = "house person"; sec.id = id;
  sec.innerHTML = `<div class="house-head row">
      <div class="who">
        <div class="lbl">Đời 2 · Nhà thứ ${i+1}</div>
        <h2><button class="name" type="button" style="font-size:inherit;font-weight:inherit">${fmt(h.n)}</button>${h.alias?` <span class="alias">(${h.alias})</span>`:""}</h2>
        ${h.sp ? `<div class="spouse">${h.sp.map(s=>fmt(s.n)+(s.gio?` <span class="chip">giỗ <b>${esc(s.gio)}</b></span>`:"")).join(", ")}</div>`:""}
      </div>
      ${h.gio ? `<span class="chip">Ngày giỗ <b>${esc(h.gio)}</b></span>`:""}
    </div>`;
  const body = document.createElement("div"); body.className = "house-body";
  if(nk) body.appendChild(renderKids(h, 3));
  else body.innerHTML = `<div class="empty">Bản gốc không ghi con cháu.</div>`;
  sec.appendChild(body);
  houses.appendChild(sec);
  h.el = sec; all.push(h);
  sec.querySelector(".house-head .name").addEventListener("click",()=>showPath(h));
});
// house section is not a collapsible .person for tree purposes
document.querySelectorAll(".house").forEach(s=>s.classList.remove("person"));

// giỗ table
const gios = [["Cụ ông Phạm Việt","Đời 1","12/9 ÂL"],["Cụ bà Rụt","Đời 1","14/4 ÂL"]];
(function walk(list){ list.forEach(p=>{
  if(p.gio) gios.push([plain(p.n),"Đời "+p.gen,p.gio]);
  (p.sp||[]).forEach(s=>{ if(s.gio) gios.push([s.n,"Đời "+p.gen + " · vợ " + plain(p.n).replace(/^Ông /,"ông "),s.gio]); });
  if(p.kids) walk(p.kids);
}); })(D2);
document.getElementById("gioBody").innerHTML = gios.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("");

// lineage
let selected = null;
function showPath(p){
  const chain = []; let c = p;
  while(c){ chain.unshift(c); c = c.parent; }
  document.getElementById("pathList").innerHTML = chain.map(n=>
    `<li style="--gc:${gc(n.gen)}"><span class="g">Đời ${n.gen}</span>${fmt(n.n)}</li>`).join("");
  document.getElementById("path").hidden = false;
  if(selected) selected.el.classList.remove("sel");
  selected = p; p.el.classList.add("sel");
}
document.getElementById("pathClose").addEventListener("click",()=>{
  document.getElementById("path").hidden = true;
  if(selected){ selected.el.classList.remove("sel"); selected = null; }
});

// open/close all
const treeNodes = () => all.filter(p=>p.gen>=3 && p.kids && p.kids.length);
document.getElementById("openAll").onclick = ()=> treeNodes().forEach(p=>setOpen(p,true));
document.getElementById("closeAll").onclick = ()=> treeNodes().forEach(p=>setOpen(p,false));

// search
const hint = document.getElementById("hint"), hintDefault = hint.textContent;
document.getElementById("q").addEventListener("input", e=>{
  const q = fold(e.target.value.trim());
  all.forEach(p=>p.el.classList.remove("hit","dim"));
  if(!q){ hint.textContent = hintDefault; return; }
  const hits = all.filter(p=> fold(p.n).includes(q) || (p.sp||[]).some(s=>fold(s.n).includes(q)));
  all.forEach(p=>p.el.classList.add(hits.includes(p)?"hit":"dim"));
  hits.forEach(p=>{ let c = p.parent; while(c && c.gen>=3){ setOpen(c,true); c = c.parent; } });
  hint.textContent = hits.length ? `Tìm thấy ${hits.length} người (kể cả tên vợ/chồng). Bấm vào tên để xem dòng dõi.` : "Không có tên nào khớp.";
  if(hits[0]) hits[0].el.scrollIntoView({block:"center"});
});
</script>

</body></html>
