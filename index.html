<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách tài liệu - PhamHai</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 48px auto;
    padding: 0 24px;
    color: #1f2328;
    background: #ffffff;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #656d76; font-size: 0.9rem; margin-bottom: 28px; }
  ul { list-style: none; padding-left: 0; margin: 0; }
  ul ul {
    padding-left: 22px;
    border-left: 1px solid #d1d9e0;
    margin: 4px 0 8px 10px;
  }
  li { margin: 2px 0; }
  .folder-name { font-weight: 600; padding: 6px 0; display: block; color: #1f2328; }
  a { text-decoration: none; color: #0969da; padding: 4px 0; display: inline-block; }
  a:hover { text-decoration: underline; }
  .icon { margin-right: 6px; }
  #status { color: #656d76; font-style: italic; }
  .error, .notice {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .error  { color: #cf222e; background: #fff1f0; border: 1px solid #ffcecb; }
  .notice { color: #9a6700; background: #fff8c5; border: 1px solid #f5e0a0; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>📄 Danh sách tài liệu</h1>
<div class="subtitle">Tự động cập nhật từ repo GitHub</div>
<div id="file-list"><span id="status">Đang tải danh sách...</span></div>

<script>
const owner  = "phamhaidc";
const repo   = "docs";
const branch = "HEAD";                 // nhánh mặc định của repo
const CACHE_KEY = `filetree:${owner}/${repo}`;
const CACHE_TTL_MS = 10 * 60 * 1000;   // 10 phút

const listEl = document.getElementById('file-list');

// ---------- Cache (localStorage, bọc try/catch) ----------
function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function writeCache(paths) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), paths })); } catch {}
}

// ---------- Lấy toàn bộ cây file bằng 1 request ----------
async function fetchHtmlPaths() {
  const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
  const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });

  if (!res.ok) {
    let msg = `Không tải được danh sách file (HTTP ${res.status})`;
    if ((res.status === 403 || res.status === 429) &&
        res.headers.get('x-ratelimit-remaining') === '0') {
      const reset = Number(res.headers.get('x-ratelimit-reset')) * 1000;
      const at = reset ? new Date(reset).toLocaleTimeString('vi-VN') : '';
      msg = `Đã hết hạn mức GitHub API cho IP này (60 request/giờ). Thử lại sau ${at}.`;
    } else if (res.status === 404) {
      msg = `Không tìm thấy repo ${owner}/${repo} (repo private hoặc sai tên).`;
    }
    throw new Error(msg);
  }

  const data = await res.json();
  const paths = data.tree
    .filter(n => n.type === 'blob')
    .map(n => n.path)
    .filter(p => p.toLowerCase().endsWith('.html'))
    .filter(p => !p.split('/').some(seg => seg.startsWith('.')))   // bỏ .github, .DS_Store...
    .filter(p => p.toLowerCase() !== 'index.html');                // bỏ chính trang này
  return { paths, truncated: !!data.truncated };
}

// ---------- Dựng cây thư mục từ danh sách path ----------
function buildTree(paths) {
  const root = { dirs: {}, files: [] };
  for (const p of paths) {
    const parts = p.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      node = node.dirs[parts[i]] ??= { dirs: {}, files: [] };
    }
    node.files.push({ name: parts[parts.length - 1], path: p });
  }
  return root;
}

function renderNode(node) {
  const ul = document.createElement('ul');
  const cmp = (a, b) => a.localeCompare(b, 'vi');

  for (const name of Object.keys(node.dirs).sort(cmp)) {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.className = 'folder-name';
    label.innerHTML = '<span class="icon">📁</span>';
    label.append(name);                       // textContent, tránh chèn HTML
    li.appendChild(label);
    li.appendChild(renderNode(node.dirs[name]));
    ul.appendChild(li);
  }

  for (const f of node.files.sort((a, b) => cmp(a.name, b.name))) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = f.path.split('/').map(encodeURIComponent).join('/');
    a.target = '_blank';
    a.innerHTML = '<span class="icon">📄</span>';
    a.append(f.name);
    li.appendChild(a);
    ul.appendChild(li);
  }
  return ul;
}

function showBox(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  listEl.appendChild(div);
}

function render(paths) {
  if (!paths.length) { showBox('notice', 'Chưa có file .html nào trong repo.'); return; }
  listEl.appendChild(renderNode(buildTree(paths)));
}

// ---------- Main ----------
(async () => {
  const cached = readCache();
  if (cached && Date.now() - cached.time < CACHE_TTL_MS) {
    listEl.innerHTML = '';
    render(cached.paths);
    return;
  }

  try {
    const { paths, truncated } = await fetchHtmlPaths();
    writeCache(paths);
    listEl.innerHTML = '';
    if (truncated) showBox('notice', 'Repo quá lớn, GitHub chỉ trả về một phần danh sách.');
    render(paths);
  } catch (err) {
    listEl.innerHTML = '';
    showBox('error', err.message);
    if (cached) {                          // còn cache cũ thì vẫn hiển thị
      showBox('notice', `Đang hiển thị danh sách lưu lúc ${new Date(cached.time).toLocaleString('vi-VN')}.`);
      render(cached.paths);
    }
  }
})();
</script>
</body>
</html>
