<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hệ sinh thái Fine Dining Dcorp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky control bar, then four stacked lanes (FOH by guest journey, integration, branch back office, HQ & supply), with an SVG wire layer behind the cards. Dark-first per DCORP_BRAND. */
:root{
  --bg:#09090B; --bg-subtle:#0C0C10; --s1:#111116; --s2:#18181F; --s3:#1E1E27;
  --bd-sub:rgba(255,255,255,.05); --bd:rgba(255,255,255,.09); --bd-strong:rgba(255,255,255,.16);
  --tx:#EEEEF4; --tx-body:#9898AA; --tx-mute:#606070;
  --accent:#E31E24; --accent-tx:#F05458; --accent-soft:rgba(227,30,36,.12); --accent-bd:rgba(227,30,36,.34);
  --ok:#3ACA6A; --wire:#7A7A8E;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F2F6; --bg-subtle:#E8E8EE; --s1:#FFFFFF; --s2:#F7F7FB; --s3:#EDEDF3;
  --bd-sub:rgba(0,0,0,.05); --bd:rgba(0,0,0,.10); --bd-strong:rgba(0,0,0,.18);
  --tx:#0C0C14; --tx-body:#3C3C50; --tx-mute:#6C6C80;
  --accent:#C01A1F; --accent-tx:#961418; --accent-soft:rgba(192,26,31,.07); --accent-bd:rgba(192,26,31,.30);
  --ok:#0A6E2E; --wire:#8A8AA0; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F2F2F6; --bg-subtle:#E8E8EE; --s1:#FFFFFF; --s2:#F7F7FB; --s3:#EDEDF3;
  --bd-sub:rgba(0,0,0,.05); --bd:rgba(0,0,0,.10); --bd-strong:rgba(0,0,0,.18);
  --tx:#0C0C14; --tx-body:#3C3C50; --tx-mute:#6C6C80;
  --accent:#C01A1F; --accent-tx:#961418; --accent-soft:rgba(192,26,31,.07); --accent-bd:rgba(192,26,31,.30);
  --ok:#0A6E2E; --wire:#8A8AA0; color-scheme:light;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-tx);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* Hero */
.hero{padding-block:28px 18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-tx);display:flex;gap:10px;align-items:center}
.kicker::before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4.4vw,52px);line-height:1;letter-spacing:.005em;margin:10px 0 12px;text-wrap:balance;text-transform:uppercase}
.lead{color:var(--tx-body);max-width:62ch;margin:0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.stat{background:var(--s1);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat b small{font-size:20px;color:var(--tx-mute);font-weight:600}
.stat span{font-size:12px;color:var(--tx-body)}
.stat.key b{color:var(--accent-tx)}

/* Controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-mute);margin-right:4px}
.chip{border:1px solid var(--bd);background:var(--s1);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--tx-body)}
.chip:hover{border-color:var(--bd-strong);color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{border:1px solid var(--bd-strong);background:var(--s2);border-radius:5px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--tx-mute)}
.btn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.btn.cta{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-tx)}
.spacer{flex:1}
.lang{display:inline-flex;border:1px solid var(--bd-strong);border-radius:5px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 10px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--tx-mute)}
.lang button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}

.trace{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--s1);border:1px solid var(--accent-bd);border-radius:6px;padding:8px 10px}
.trace .n{font-family:var(--f-mono);font-size:12px;color:var(--accent-tx);white-space:nowrap}
.trace .t{flex:1 1 260px;min-width:0;font-size:13.5px}
.trace .ctl{display:flex;gap:6px}
.trace .ctl button{border:1px solid var(--bd);background:var(--s2);border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:16px;padding-block:14px 4px;color:var(--tx-body);font-size:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.sw-d{width:14px;height:14px;border-radius:3px;border:1px solid var(--accent-bd);background:var(--accent-soft)}
.sw-p{width:14px;height:14px;border-radius:3px;border:1px dashed var(--bd-strong);background:var(--s1)}
.sw-rt{width:22px;height:0;border-top:2px solid var(--wire)}
.sw-b{width:22px;height:0;border-top:2px dashed var(--wire)}

/* Map */
.map{position:relative;padding-block:10px 40px}
#wires{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
.lane{position:relative;z-index:1;margin-top:22px}
.lane-h{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--bd-strong);padding-top:10px;margin-bottom:12px}
.lane-h h2{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0}
.lane-h .tag{font-family:var(--f-mono);font-size:11px;color:var(--tx-mute);letter-spacing:.08em}
.lane-h p{margin:0;color:var(--tx-body);font-size:13px}
.lane.foh .lane-h{border-top-color:var(--accent)}

.journey{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-h{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:1px dashed var(--bd)}
.stage-h .no{font-family:var(--f-mono);font-size:11px;color:var(--accent-tx)}
.stage-h .nm{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.stage-h .cv{font-family:var(--f-mono);font-size:10.5px;color:var(--tx-mute);min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.mod{position:relative;text-align:left;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:11px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:opacity .2s,border-color .2s,background .2s,transform .2s}
.mod:hover{border-color:var(--bd-strong)}
.mod .nm{font-weight:600;font-size:14px;line-height:1.3}
.mod .pr{font-family:var(--f-mono);font-size:11px;color:var(--tx-body);display:flex;flex-wrap:wrap;gap:4px 8px}
.mod .own{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.mod.dcorp .own{color:var(--accent-tx);background:var(--accent-soft)}
.mod.partner{border-style:dashed}
.mod.partner .own{color:var(--tx-mute);background:var(--s3)}
.mod.site .own{display:none}
.mod .nm{padding-right:58px}
.mod .direct{align-self:flex-start;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);border:1px solid currentColor;border-radius:3px;padding:1px 6px}
.mod.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mod.on{border-color:var(--accent);background:var(--accent-soft)}
.mod.done{border-color:var(--accent-bd)}
.mod .stepno{position:absolute;left:-8px;top:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:11px;display:grid;place-items:center;padding:0 5px}
.map.dim .mod:not(.hit){opacity:.22}
.map.cov .mod.dcorp{background:var(--accent-soft);border-color:var(--accent-bd)}
.map.cov .mod.partner{opacity:1}
.stage-h .cv{display:none}
.map.cov .stage-h .cv{display:block}

#wires path.w{fill:none;stroke:var(--wire);stroke-width:1.5}
#wires path.w.b{stroke-dasharray:5 4}
#wires path.w.tr{stroke:var(--accent);stroke-width:2}
#wires text{font-family:var(--f-mono);font-size:10.5px;fill:var(--tx-body);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}

/* Panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--s1);border-left:1px solid var(--bd-strong);z-index:40;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none;box-shadow:-12px 0 40px rgba(0,0,0,.35)}
.panel-h{display:flex;justify-content:space-between;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--bd)}
.panel-h h3{font-family:var(--f-display);font-size:26px;line-height:1.05;margin:4px 0 0;text-transform:uppercase;letter-spacing:.02em}
.x{border:1px solid var(--bd);background:var(--s2);border-radius:4px;width:32px;height:32px;cursor:pointer;flex:none}
.panel-b{overflow:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:16px}
.panel-b h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-mute);margin:0 0 6px;font-weight:500}
.panel-b ul{margin:0;padding-left:18px;color:var(--tx-body)}
.panel-b li{margin:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:3px;background:var(--s3);color:var(--tx-body)}
.tg.d{background:var(--accent-soft);color:var(--accent-tx)}
.tg.ok{color:var(--ok);border:1px solid currentColor;background:transparent}
.links{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--bd);background:var(--s2);border-radius:4px;padding:7px 9px;cursor:pointer}
.lk:hover{border-color:var(--bd-strong)}
.lk span{font-size:13px}
.lk em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--tx-mute);text-align:right}
.hint{color:var(--tx-mute);font-size:12.5px}

footer{border-top:1px solid var(--bd);padding-block:18px 28px;color:var(--tx-mute);font-size:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
footer b{color:var(--tx);font-weight:600}

@media (max-width:1100px){.journey{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.journey{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:minmax(0,1fr)}.stat b{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  });

function rel(el,base){const a=el.getBoundingClientRect(),b=base.getBoundingClientRect();
  return {l:a.left-b.left,t:a.top-b.top,r:a.right-b.left,b:a.bottom-b.top,cx:(a.left+a.right)/2-b.left,cy:(a.top+a.bottom)/2-b.top}}
function path(A,B){
  let x1,y1,x2,y2,d;
  if(B.t>=A.b-2){x1=A.cx;y1=A.b;x2=B.cx;y2=B.t}
  else if(B.b<=A.t+2){x1=A.cx;y1=A.t;x2=B.cx;y2=B.b}
  else if(B.l>=A.r){x1=A.r;y1=A.cy;x2=B.l;y2=B.cy}
  else {x1=A.l;y1=A.cy;x2=B.r;y2=B.cy}
  if(Math.abs(y2-y1)>Math.abs(x2-x1)*.3){const my=(y1+y2)/2;d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`}
  else{const mx=(x1+x2)/2;d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`}
  return {d,mx:(x1+x2)/2,my:(y1+y2)/2};
}

    const steps=TRACES[tr.key];
    for(let i=1;i<=tr.i;i++){
      const a=el(steps[i-1][0]),b=el(steps[i][0]); if(!a||!b||a===b) continue;
      const p=path(rel(a,map),rel(b,map));
      out.push(`<path class="w tr" d="${p.d}" marker-end="url(#ahr)"/>`);
    }
  } else if(sel){
    L.filter(x=>x[0]===sel||x[1]===sel).forEach(x=>{
      const a=el(x[0]),b=el(x[1]); if(!a||!b) return;
      const p=path(rel(a,map),rel(b,map));
      out.push(`<path class="w${x[2]==='b'?' b':''}" d="${p.d}" marker-end="url(#ah)"/><text x="${p.mx}" y="${p.my}" text-anchor="middle" dominant-baseline="middle">${esc(x[lang==='vi'?3:4])}</text>`);
    });
  }
  g.innerHTML=out.join('');
}
function openPanel(id){
  const m=byId[id]; sel=id;
  $('#pK').textContent=m.o==='dcorp'?u('lgD'):m.o==='partner'?u('lgP'):'';
  $('#pT').textContent=m.t[li()];
  const ins=L.filter(x=>x[1]===id), outs=L.filter(x=>x[0]===id);
  const lk=(arr,k)=>arr.length?`<div class="links">${arr.map(x=>{const o=byId[x[k]];return `<button type="button" class="lk" data-go="${o.id}"><span>${esc(o.t[li()])}</span><em>${esc(x[lang==='vi'?3:4])}${x[2]==='b'?' · '+u('lgB'):''}</em></button>`}).join('')}</div>`:`<span class="hint">${u('none')}</span>`;
  const tags=m.p.map(p=>`<span class="tg${m.o==='dcorp'?' d':''}">${esc(p)}</span>`).join('')+(m.direct?`<span class="tg ok">${u('direct')}</span>`:'')+(m.id==='erp'?`<span class="tg">${u('third')}</span>`:'');
  $('#pB').innerHTML=`
    ${tags?`<div><h4>${u('prods')}</h4><div class="tags">${tags}</div></div>`:''}
    <div><h4>${u('func')}</h4><ul>${m.d[li()].map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
    <div><h4>${u('users')}</h4><div class="tags">${m.r.map(r=>`<span class="tg">${ROLES[r][li()]}</span>`).join('')}</div></div>
    <div><h4>${u('from')}</h4>${lk(ins,0)}</div>
    <div><h4>${u('to')}</h4>${lk(outs,1)}</div>`;
  $('#panel').classList.add('open');
  apply();
}
function closePanel(){sel=null;$('#panel').classList.remove('open');apply()}

/* Trace */
function startTrace(key){
  stopTrace(true); closePanel();
  tr={key,i:0,timer:null,playing:!reduced};
  $('#trace').hidden=false; showStep(); if(tr.playing) tick();
}
function tick(){clearTimeout(tr.timer); tr.timer=setTimeout(()=>{if(!tr)return; if(tr.i<TRACES[tr.key].length-1){tr.i++;showStep();tick()} else {tr.playing=false;showStep()}},1900)}
function showStep(){
  const steps=TRACES[tr.key], s=steps[tr.i];
  $('#trN').textContent=`${u('step')} ${tr.i+1}/${steps.length}`;
  $('#trT').textContent=s[lang==='vi'?1:2];
  $('#trPlay').textContent=tr.playing?u('pause'):u('play');
  $$('.mod').forEach(el=>{el.classList.remove('on','done');el.querySelector('.stepno')?.remove()});
  const seen=new Set();
  steps.slice(0,tr.i+1).forEach((st,i)=>{
    const el=$(`.mod[data-id="${st[0]}"]`); if(!el) return;
    el.classList.add(i===tr.i?'on':'done');
    if(!seen.has(st[0])){const n=document.createElement('span');n.className='stepno';el.appendChild(n);seen.add(st[0])}
    el.querySelector('.stepno').textContent=i+1;
  });
  $('#map').classList.add('dim');
  $$('.mod').forEach(el=>el.classList.toggle('hit',steps.slice(0,tr.i+1).some(s=>s[0]===el.dataset.id)));
  draw();
  const cur=$(`.mod[data-id="${s[0]}"]`);
  if(cur){const r=cur.getBoundingClientRect(),bar=$('.bar').getBoundingClientRect().bottom;
    if(r.top<bar+8||r.bottom>innerHeight-8) window.scrollBy({top:r.top-bar-120,behavior:reduced?'auto':'smooth'})}
}
function stopTrace(silent){
  if(!tr) return; clearTimeout(tr.timer); tr=null;
  $('#trace').hidden=true;
  $$('.mod').forEach(el=>{el.classList.remove('on','done');el.querySelector('.stepno')?.remove()});
  if(!silent) apply();
}

/* Events */
document.addEventListener('click',e=>{
  const mod=e.target.closest('.mod'); if(mod){ if(tr) stopTrace(true); openPanel(mod.dataset.id); return }
  const go=e.target.closest('[data-go]'); if(go){openPanel(go.dataset.go); $(`.mod[data-id="${go.dataset.go}"]`)?.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'}); return}
  const chip=e.target.closest('.chip'); if(chip){role=chip.dataset.r||null; if(tr) stopTrace(true); $$('.chip').forEach(c=>c.setAttribute('aria-pressed',(c.dataset.r||null)===role)); apply(); return}
  const lb=e.target.closest('.lang button'); if(lb){lang=lb.dataset.l; try{localStorage.setItem('fd-lang',lang)}catch(_){}; render(); return}
});
$('#pX').onclick=closePanel;
$('#cov').onclick=()=>{cov=!cov;apply()};
$('#tDine').onclick=()=>startTrace('dine');
$('#tDel').onclick=()=>startTrace('del');
$('#tSup').onclick=()=>startTrace('sup');
$('#trPrev').onclick=()=>{if(!tr)return;tr.playing=false;clearTimeout(tr.timer);tr.i=Math.max(0,tr.i-1);showStep()};
$('#trNext').onclick=()=>{if(!tr)return;tr.playing=false;clearTimeout(tr.timer);tr.i=Math.min(TRACES[tr.key].length-1,tr.i+1);showStep()};
$('#trPlay').onclick=()=>{if(!tr)return;if(tr.playing){tr.playing=false;clearTimeout(tr.timer)}else{if(tr.i>=TRACES[tr.key].length-1)tr.i=0;tr.playing=true;tick()}showStep()};
$('#trStop').onclick=()=>stopTrace();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(tr)stopTrace();else closePanel()}});
new ResizeObserver(()=>draw()).observe($('#map'));
try{const s=localStorage.getItem('fd-lang'); if(s==='en'||s==='vi') lang=s}catch(_){}
render();
document.fonts&&document.fonts.ready.then(draw);
</script>

</body></html>
